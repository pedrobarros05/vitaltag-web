# Runs the frontend checks on every push / pull request.
# Same commands as locally (see docs/testing.md). No backend needed: the E2E tests
# start the API mock themselves.
name: Web tests

on:
  push:
  pull_request:

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: API mock tests
        run: npm run test:mock

      - name: Unit + component tests (Vitest)
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
